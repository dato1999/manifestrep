apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: {{ .Values.spark.jobName }}
  namespace: {{ .Release.Namespace }}
spec:
  type: Python
  mode: cluster
  image: "davidkokauri/mysp1:v2"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/apps/streaming_app.py"
  deps:
    packages:
      - "org.apache.spark:spark-sql-kafka-0-10_2.13:3.5.0"
  sparkConf:
    "spark.jars.ivy": "/tmp"
    "spark.driver.extraJavaOptions": "-Divy.cache.dir=/tmp -Divy.home=/tmp"
    "spark.executor.extraJavaOptions": "-Divy.cache.dir=/tmp -Divy.home=/tmp"

  arguments:
    - "{{ .Values.spark.topicName }}"
    - "{{ .Values.spark.schemaDDL }}"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureInterval: 10
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "1024m"
    labels:
      version: 3.5.0
    serviceAccount: spark-operator-spark
  executor:
    cores: 1
    instances: 2
    memory: "2048m"
    labels:
      version: 3.5.0


